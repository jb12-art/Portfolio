<!-- game.html -->
<!-- The universal page where game template lives -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- desktop browser favicon -->
    <link
      rel="icon"
      type="image/png"
      href="./src/image/favicon/favicon-32x32.png"
    />
    <!-- Apple browser favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./src/image/favicon/apple-touch-icon.png"
    />
    <!-- Android browser favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./src/image/favicon/android-chrome-192x192.png"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Logo styling -->
    <link rel="stylesheet" href="src/css/logo.css" />

    <!-- Navigation styling -->
    <link rel="stylesheet" href="src/css/navigation.css" />

    <!-- Logo JavaScript -->
    <script src="src/js/logo.js" defer></script>

    <!-- Navigation JavaScript -->
    <script src="src/js/navigation.js" defer></script>

    <!-- GAME -->
    <!-- Game-specific sizing -->
    <link rel="stylesheet" href="src/css/game.css" />
    <!-- GallowGame styling -->
    <link rel="stylesheet" href="src/css/gallow.css" />

    <title>Play Game</title>
  </head>
  <body>
    <!-- Shared logo -->
    <header class="logo"></header>

    <!-- Shared navigation -->
    <nav class="nav"></nav>

    <!-- The Game Canvas -->
    <main class="game-container">
      <!-- The title will change dynamically based on the game -->
      <h1 id="gameTitle">The Gallow</h1>

      <!-- Game settings -->
      <section id="gameSettings" class="game-settings">
        <h2>Game Settings</h2>

        <!-- Choose language -->
        <label for="languageSelect">Choose Language</label>

        <select id="languageSelect">
          <option value="en">🇬🇧 English</option>
          <option value="no">🇳🇴 Norsk</option>
          <option value="fi">🇫🇮 Suomi</option>
        </select>

        <!-- Choose genre -->
        <label for="genreSelect">Choose Genre</label>

        <select id="genreSelect">
          <option value="animals">Animals</option>
          <option value="food">Food</option>
          <option value="countries">Countries</option>
          <option value="technology">Technology</option>
          <option value="nature">Nature</option>
          <option value="sports">Sports</option>
        </select>

        <!-- Start game -->
        <button id="startButton" type="button">Start Game</button>
      </section>

      <!-- Game area -->
      <section id="gameArea" hidden>
        <!-- Hangman drawing -->
        <!-- The Game Canvas where your JS draws the graphics -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Virtual keyboard -->
        <div id="keyboard" class="keyboard"></div>

        <!-- Mobile keyboard -->
        <button id="restartButton" type="button">Play Again</button>
      </section>
    </main>

    <!-- This script acts as the "console" that insterts the right game cartridge -->
    <script type="module" src="src/launcher.js"></script>
  </body>
</html>
